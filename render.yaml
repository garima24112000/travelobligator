# Section 203B: Render Blueprint for the portfolio backend -- ONE free Docker web service, nothing else.
#
# Not included on purpose: no Render Postgres (Neon is the database), no Render Key Value/Redis (Upstash is the
# cache), no worker, no cron job, no disk, no preDeployCommand (a paid feature -- migrations are a separate,
# explicit step run BEFORE a deploy; see docs/22_free_tier_deployment.md). This file contains NO secret value:
# `sync: false` variables are typed into the Render dashboard, `generateValue` ones are generated by Render.
#
# The image is backend/Dockerfile unchanged: non-root, `python -m app.serve`, exactly one Uvicorn worker bound to
# 0.0.0.0:$PORT (Render injects PORT). Free instances sleep after inactivity and have an ephemeral filesystem;
# the service keeps no local state (PostgreSQL is authoritative, Redis is a disposable cache).

services:
  - type: web
    name: travelobligator-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness only: no database, cache or provider call, so a sleeping Neon/Upstash never fails a deploy check.
    healthCheckPath: /health
    # Deploys are started by hand, AFTER the migration step for that commit has succeeded.
    autoDeploy: false
    envVars:
      # ---- public configuration
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PERSISTENCE_BACKEND
        value: postgres
      - key: PROVIDER_CACHE_BACKEND
        value: redis
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_HTTPONLY
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      # /metrics is not served on the public backend; /ready needs OPS_TOKEN (see below).
      - key: METRICS_ENABLED
        value: "false"
      # Generation runs as a background task and the browser polls the job, so no single request has to outlive
      # the proxy in front of this service.
      - key: ASYNC_GENERATION_ENABLED
        value: "true"
      # Small bounded pool for a single free instance (max connections = 3 + 2, plus one readiness probe).
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      # Neon resumes a suspended compute on the first connection; allow for that instead of failing startup.
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"
      # The frontend origin (https://<project>.vercel.app). Browser traffic is same-origin through the frontend's
      # /api rewrite, so this only narrows which origin could ever call the backend directly.
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # Section 203C.1: place geocoding goes through Geoapify. The public Nominatim endpoint rate-limits shared
      # hosting egress (HTTP 429) and is rejected as the production geocoder. Overpass POI discovery is unchanged.
      - key: GEOCODING_PROVIDER
        value: geoapify
      # Section 203C.2B: the production itinerary engine. Geoapify Places supplies the broad factual pool and
      # Geoapify Routing the real walking distance/time (one request per itinerary day); Overpass is not used in
      # production and there is no fallback to it. AI anchor proposals are hypotheses only: each is grounded
      # through Geoapify before it can be scheduled. The inventory sufficiency gate cannot be turned off here.
      - key: PLACES_PROVIDER
        value: geoapify
      - key: ROUTING_PROVIDER
        value: geoapify
      - key: INVENTORY_SUFFICIENCY_GATE_ENABLED
        value: "true"
      # Hard cap on Geoapify credits per generation (free plan: 3,000 credits/day).
      - key: GEOAPIFY_MAX_CREDITS_PER_GENERATION
        value: "100"
      - key: AI_CANDIDATE_PROPOSAL_PROVIDER
        value: groq
      - key: AI_CANDIDATE_DISCOVERY_ENABLED
        value: "true"
      - key: AI_DIRECTED_PROVIDER_DISCOVERY_MAX_SEARCHES
        value: "16"
      - key: AI_DIRECTED_PROVIDER_DISCOVERY_MAX_EXTRA_SEARCHES
        value: "4"
      # ---- secrets (dashboard only)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # ---- provider credential (dashboard only)
      - key: GROQ_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      # ---- generated secrets
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: OPS_TOKEN
        generateValue: true
