[pytest]
pythonpath = backend
testpaths = backend/app/tests
markers =
    postgres_integration: needs a real, migrated PostgreSQL (gated by TRAVELOB_RUN_POSTGRES_TESTS=1 + DATABASE_URL); never part of the hermetic default run.
    redis_integration: needs a real Redis (gated by TRAVELOB_RUN_REDIS_TESTS=1 + REDIS_URL); never part of the hermetic default run.
