# Section 200E: production-STYLE local stack, built from the real images (no source bind mounts, no --reload,
# no dev servers):
#
#   postgres (healthy) -> migrate (one-shot: alembic upgrade head, must succeed) -> backend (verifies the schema,
#   never migrates) -> frontend.   redis is OPTIONAL infrastructure (a disposable provider-response cache) that starts in
#   parallel: the backend does NOT wait for it and starts degraded (/ready 200 "degraded", provider calls uncached) if it
#   is down; PostgreSQL and the migration are the only hard prerequisites.
#
#   docker compose up --build                       # this stack
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up   # the old hot-reload dev workflow
#
# Configuration comes from the PROJECT ENVIRONMENT (compose reads ./.env for `${...}` interpolation, or the file you
# pass with --env-file). Required: POSTGRES_PASSWORD and SESSION_SECRET_KEY (no default is shipped -- this file
# contains no credential). Application settings (AI keys, feature flags, ...) are read from APP_ENV_FILE
# (default ./.env, optional). To run without touching your own .env:
#   docker compose --env-file /path/to/stack.env -p myproject up --build   (with APP_ENV_FILE set in that file)
#
# Networks: `data` is INTERNAL (postgres/redis/migrate/backend only -- no host access, no internet); `edge` carries
# browser-facing traffic and the backend's outbound calls to travel providers. Postgres and Redis publish NO host
# ports (dev override publishes them on 127.0.0.1 only). Backend/frontend publish on 127.0.0.1 only.
#
# LOCAL ONLY: plain HTTP, no TLS, no auth on /ready and /metrics (production needs private routing/access control,
# HTTPS and Secure cookies -- Section 203). Not a deployment.

name: travelobligator

x-backend-env: &backend-env
  PERSISTENCE_BACKEND: postgres
  # Service DNS names (never localhost inside a container). The password must be URL-safe (letters/digits/-._~).
  DATABASE_URL: postgresql://${POSTGRES_USER:-travelobligator}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-travelobligator}
  PROVIDER_CACHE_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
  PORT: "8000"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelobligator}
      POSTGRES_USER: ${POSTGRES_USER:-travelobligator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # Cache only and DISPOSABLE: no persistence (a restart empties it -- the only consequence is future cache misses /
    # provider calls; application data lives in PostgreSQL), bounded memory, LRU eviction. Not a startup dependency of
    # the backend (see `backend.depends_on`).
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    # ONE explicit one-shot migration (the same command a deployment pipeline will run once per release). The backend
    # never migrates by itself, and this runs once here -- not once per backend replica.
    build:
      context: ./backend
    image: travelobligator-backend:local
    command: ["python", "scripts/run_migrations.py"]
    environment: *backend-env
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  backend:
    image: travelobligator-backend:local
    environment: *backend-env
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    # STARTUP CONTRACT: PostgreSQL is authoritative and the migration must have succeeded -- both are hard
    # prerequisites. Redis is deliberately NOT listed: it is an optional provider-response cache, so the backend must be
    # able to start (degraded, uncached) when Redis is down or absent -- both before and after startup. Do not add a
    # `redis` dependency here.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [data, edge]
    # Runtime hardening: read-only root filesystem (Postgres + Redis mode writes nothing), a small tmpfs for /tmp,
    # no Linux capabilities, no privilege escalation. Liveness = /health (image HEALTHCHECK); traffic readiness =
    # /ready (for an orchestrator/load balancer, not for Docker restarts).
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # uvicorn's graceful window (20 s) plus lifespan shutdown must fit inside this.
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time FALLBACK only; the RUNTIME value below is what the browser uses.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: travelobligator-frontend:local
    environment:
      # The address the BROWSER uses to reach the backend (public value; never an internal service name).
      API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      PORT: "3000"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    restart: unless-stopped

networks:
  data:
    internal: true
  edge: {}

volumes:
  postgres_data:
